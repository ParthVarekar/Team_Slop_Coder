services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: weft
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - weft-postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - WEFT_DATABASE_URL=postgres://weft:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@db:5432/weft
      - WEFT_SERVER_HOST=0.0.0.0
      - WEFT_SERVER_PORT=7420
      - WEFT_SERVER_DATA_DIR=/var/lib/weft
      - WEFT_LOG_LEVEL=${WEFT_LOG_LEVEL:-info}
      - WEFT_SERVER_CORS_ORIGIN=${WEFT_SERVER_CORS_ORIGIN:-http://127.0.0.1:5173}
      - WEFT_SERVER_WEBHOOKS_ENABLED=${WEFT_SERVER_WEBHOOKS_ENABLED:-false}
      - WEFT_SERVER_WEBHOOK_MASTER_KEY
      - WEFT_SERVER_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS=${WEFT_SERVER_WEBHOOK_ALLOW_PRIVATE_ENDPOINTS:-false}
    ports:
      - '127.0.0.1:${WEFT_PORT:-7420}:7420'
    volumes:
      - weft-server:/var/lib/weft
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7420/healthz').then(r=>r.json()).then(h=>process.exit(h.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  weft-postgres:
  weft-server:

networks:
  backend:
    internal: true
  frontend:
